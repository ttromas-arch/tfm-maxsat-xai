[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsrt-maxsat-counterfactuals"
version = "0.1.0"
description = "Minimal chest-radiograph counterfactual explanations with Partial MaxSAT"
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
